<!-- Modal reutilizable: Gestionar Credencial SII -->
<div class="modal fade" id="modalCredencial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-key me-2"></i>
                    Gestionar Credencial SII
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="formCredencial">
                    <input type="hidden" id="credencial_rut">

                    <div class="mb-3">
                        <label class="form-label">Empresa</label>
                        <input type="text" class="form-control" id="credencial_empresa" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Clave SII *</label>
                        <div class="position-relative">
                            <input type="password"
                                   class="form-control"
                                   id="credencial_clave"
                                   placeholder="Ingrese la clave del SII"
                                   required
                                   style="padding-right: 45px;">
                            <button class="password-toggle btn btn-sm btn-outline-secondary position-absolute"
                                    type="button" style="top:6px; right:6px;"
                                    onclick="togglePassword()">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                        <small style="color: var(--text-tertiary); font-size: 12px;">
                            Esta clave se almacenará de forma segura en la base de datos
                        </small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-action btn-action-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i>
                    Cancelar
                </button>
                <button type="button" class="btn btn-danger" id="btnEliminarCredencial" style="display: none;">
                    <i class="fas fa-trash"></i>
                    Eliminar
                </button>
                <button type="button" class="btn btn-action btn-action-primary" onclick="guardarCredencial()">
                    <i class="fas fa-save"></i>
                    Guardar
                </button>
            </div>
        </div>
    </div>
</div>
